<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Verifikasi LSPPI...</title>
    <script type="text/javascript">
        var l = window.location;
        // Deteksi link scan /qrview/
        if (l.pathname.includes('/qrview/')) {
            var parts = l.pathname.split('/qrview/');
            var id = parts[parts.length - 1].replace(/\/$/, "");
            var repoPath = parts[0];
            if (!repoPath.endsWith('/')) repoPath += '/';

            // Alihkan ke index.html dengan ID sebagai parameter pencarian
            var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoPath + '?id=' + encodeURIComponent(id);
            window.location.replace(target);
        } else {
            // Jika bukan link scan, balik ke halaman utama repositori
            window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/')[1] + '/');
        }
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
    <p>Sedang memverifikasi data, mohon tunggu...</p>
</body>
</html>

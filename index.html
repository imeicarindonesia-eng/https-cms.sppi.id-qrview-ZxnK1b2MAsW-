<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSP Pembiayaan Indonesia - Verification System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background: #f8fafc; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        .font-serif-lsp { font-family: 'Tinos', 'Times New Roman', Times, 'Georgia', serif; }
        
        /* Layout Hasil Scan Identik Screenshot_20260601-015446_2.jpg */
        .scan-page-mobile { background: white; min-height: 100vh; width: 100%; max-width: 500px; margin: 0 auto; padding: 40px 0px; color: #000; }
        .scan-header-outer { border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 12px 20px; text-align: center; }
        .scan-nama-box { border-bottom: 1px solid #000; padding: 12px 20px; text-align: center; }
        
        .scan-table { border-collapse: collapse; width: 100%; }
        .scan-table td { 
            padding: 15px 20px; 
            border-bottom: 1px solid #000; 
            vertical-align: middle; 
            font-size: 1.25rem;
            line-height: 1.35;
        }
        .scan-table td:first-child { width: 35%; padding-right: 5px; }
        .scan-table td:last-child { width: 65%; padding-left: 5px; }

        /* Styling Barcode Renggang & Titik Hijau */
        .qr-wrapper { background: white; padding: 14px; border-radius: 12px; position: relative; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .qr-green-dot { position: absolute; top: 0; left: 0; width: 4.1%; height: 4.1%; background-color: #00FF00; z-index: 50; }

        .card-orange { width: 100%; max-width: 330px; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); border-radius: 15px; overflow: hidden; position: relative; color: white; box-shadow: 0 10px 20px rgba(234, 88, 12, 0.2); }
        .card-star-bg { position: absolute; top: 0; right: 0; font-size: 150px; opacity: 0.1; transform: translate(30%, -10%) rotate(20deg); pointer-events: none; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: white; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 0.8rem; transition: 0.3s; z-index: 9999; opacity: 0; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="toast">Operasi Berhasil</div>

    <!-- VIEW PUBLIK HASIL SCAN -->
    <div id="public-view" class="hidden">
        <div class="scan-page-mobile font-serif-lsp">
            <div class="scan-header-outer"><h1 class="text-[23px] font-normal tracking-wide">LSP Pembiayaan Indonesia</h1></div>
            <div class="scan-nama-box"><h2 class="text-[23px] font-normal">Nama: <span id="pub-nama" class="uppercase"></span></h2></div>
            
            <table class="scan-table">
                <tr><td>Nomor<br>Sertifikat</td><td id="pub-no"></td></tr>
                <tr><td>Jenis<br>Sertifikat</td><td id="pub-skema"></td></tr>
                <tr><td>Berlaku<br>Sampai<br>Tanggal</td><td id="pub-tgl"></td></tr>
                <tr><td>Status<br>Sertifikat</td><td id="pub-status"></td></tr>
            </table>
            <div class="text-center mt-12 text-2xl font-normal tracking-[0.2em] text-black">----</div>
            
            <div id="back-admin-container" class="flex justify-center mt-20">
                <button onclick="location.href=window.location.origin+window.location.pathname" class="bg-black text-white px-8 py-3 rounded-full text-[11px] font-black tracking-widest uppercase shadow-xl hover:scale-105 transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> KEMBALI KE PANEL
                </button>
            </div>
        </div>
    </div>

    <!-- VIEW ADMIN PANEL -->
    <div id="admin-view" class="flex flex-col lg:flex-row h-screen overflow-hidden">
        <aside class="w-full lg:w-80 bg-white border-r border-slate-200 p-6 overflow-y-auto shadow-sm z-10">
            <h2 class="font-black text-sm text-slate-800 uppercase mb-8">CMS PANEL</h2>
            <div class="space-y-4">
                <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 mb-4">
                    <label class="text-[9px] font-black text-blue-600 uppercase block mb-1">Website URL GitHub Bos</label>
                    <input type="text" id="base-url" oninput="window.updateLive()" placeholder="Isi alamat GitHub Bos" class="w-full bg-white border border-blue-200 rounded-lg p-2 text-[10px] font-mono outline-none font-bold">
                </div>

                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Nama Peserta</label>
                    <input type="text" id="in-nama" oninput="window.updateLive()" value="MUFAZZIL" class="w-full border border-slate-200 rounded-lg p-3 text-sm font-bold bg-slate-50 outline-none uppercase">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Nomor Sertifikat</label>
                    <input type="text" id="in-no" oninput="window.updateLive()" value="8615-50214-400-0326" class="w-full border border-slate-200 rounded-lg p-3 text-sm font-bold bg-slate-50 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Skema</label>
                    <textarea id="in-skema" oninput="window.updateLive()" rows="4" class="w-full border border-slate-200 rounded-lg p-3 text-sm font-bold bg-slate-50 outline-none leading-snug">Kualifikasi 4 Bidang&#10;Pembiayaan Subbidang&#10;Penagihan</textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Masa Berlaku</label>
                        <input type="text" id="in-tgl" oninput="window.updateLive()" value="30 Maret 2029" class="w-full border border-slate-200 rounded-lg p-3 text-sm font-bold bg-slate-50 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Status</label>
                        <select id="in-status" onchange="window.updateLive()" class="w-full border border-slate-200 rounded-lg p-3 text-sm font-bold bg-slate-50 outline-none">
                            <option value="Berlaku">Berlaku</option>
                            <option value="Tidak Berlaku">Tidak Berlaku</option>
                        </select>
                    </div>
                </div>
                <button onclick="window.saveUser()" class="w-full bg-slate-900 text-white py-4 rounded-xl text-[11px] font-black uppercase tracking-widest hover:bg-black transition shadow-lg">Simpan Data Peserta</button>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto bg-slate-50">
            <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4">Daftar Database (Lokal)</h3>
            <div id="db-list" class="grid grid-cols-1 gap-3"></div>
        </main>

        <aside class="w-full lg:w-[480px] bg-white border-l border-slate-200 p-8 overflow-y-auto flex flex-col items-center">
            <div class="w-full flex flex-col items-center space-y-8 text-center">
                <h3 id="card-nama-head" class="text-2xl font-black text-slate-900 uppercase">MUFAZZIL</h3>
                <div class="qr-wrapper">
                    <div class="relative inline-block w-[220px] h-[220px]">
                        <div class="qr-green-dot"></div>
                        <img id="qr-img" src="" class="w-full h-full block">
                    </div>
                </div>
                <p class="text-[10px] font-bold text-slate-500 break-all" id="display-url">---</p>
                <!-- Mini Card Oranye -->
                <div class="card-orange p-5 flex gap-4 items-center text-left">
                    <i class="fa-solid fa-star card-star-bg"></i>
                    <div class="relative bg-white p-1 rounded-sm shrink-0"><div class="relative inline-block w-[90px] h-[90px]"><div class="qr-green-dot" style="width:5%; height:5%;"></div><img id="qr-mini" src="" class="w-full h-full block"></div></div>
                    <div class="flex flex-col justify-between h-[90px] py-1 z-10">
                        <div><p id="mini-nama" class="text-xs font-black uppercase">---</p><p id="mini-no" class="text-[10px] italic opacity-80">---</p><p id="mini-skema" class="text-[9px] mt-1 leading-tight line-clamp-2 uppercase">---</p></div>
                        <div class="text-right"><p id="mini-tgl" class="text-lg font-black">--/--</p></div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Mock untuk test langsung
        const config = { apiKey: "mock", projectId: "lsppi-pro-v27" };
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'lsppi-mirror-v27';

        // Fungsi enkripsi ID unik 12 digit
        function generateId(no) {
            return btoa(no.replace(/\D/g, '') + "sppi").substring(0, 12) + "=";
        }

        // Fungsi formatting identik 100% dengan screenshot
        function formatRow(v) { return `<div style="display:flex;"><div style="width:18px;flex-shrink:0;">:</div><div>${v}</div></div>`; }
        function formatSkema(raw) {
            const lines = raw.split('\n'); let html = "";
            for (let i = 0; i < lines.length; i++) {
                html += `<div style="display:flex; align-items:flex-start;">
                            <div style="width:18px; flex-shrink:0;">${i === 1 ? ':' : '&nbsp;'}</div>
                            <div>${lines[i].trim()}</div>
                         </div>`;
            }
            return html;
        }

        window.updateLive = function() {
            const nama = document.getElementById('in-nama').value.toUpperCase();
            const no = document.getElementById('in-no').value;
            const skema = document.getElementById('in-skema').value;
            const tgl = document.getElementById('in-tgl').value;
            const custom = document.getElementById('base-url').value.trim();
            const activeId = generateId(no);
            
            document.getElementById('card-nama-head').innerText = nama || "---";
            document.getElementById('mini-nama').innerText = nama || "---";
            document.getElementById('mini-no').innerText = no || "---";
            document.getElementById('mini-skema').innerText = skema.replace(/\n/g, ' ').toUpperCase() || "---";
            
            const year = tgl.match(/\d{4}/);
            document.getElementById('mini-tgl').innerText = "04/" + (year ? year[0].slice(-2) : "29");

            // LOGIKA LINK MIRRORING
            let targetUrl = (custom || window.location.origin + window.location.pathname).replace(/\/$/, "") + "/qrview/" + activeId;
            document.getElementById('display-url').innerText = targetUrl;
            
            const qr = `https://api.qrserver.com/v1/create-qr-code/?size=450x450&color=003366&margin=0&ecc=L&data=${encodeURIComponent(targetUrl)}`;
            document.getElementById('qr-img').src = qr; document.getElementById('qr-mini').src = qr;
        };

        window.saveUser = async function() {
            const no = document.getElementById('in-no').value; const nama = document.getElementById('in-nama').value;
            const activeId = generateId(no);
            const data = { nama: nama.toUpperCase(), no, skema: document.getElementById('in-skema').value, tgl: document.getElementById('in-tgl').value, status: document.getElementById('in-status').value };
            
            let local = JSON.parse(localStorage.getItem('lsppi_v27') || "[]");
            local = local.filter(x => x.id !== activeId); local.unshift({id: activeId, ...data});
            localStorage.setItem('lsppi_v27', JSON.stringify(local));
            window.renderDB(); showToast("Data Tersimpan!");
        };

        window.renderDB = function() {
            const list = document.getElementById('db-list'); if(!list) return; list.innerHTML = '';
            const items = JSON.parse(localStorage.getItem('lsppi_v27') || "[]");
            items.forEach(p => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-xl border flex justify-between items-center";
                div.innerHTML = `<div><p class="font-black text-xs uppercase">${p.nama}</p><p class="text-[9px] opacity-50">ID: ${p.id}</p></div>
                                 <button onclick="window.showScan('${p.id}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-[9px] font-black uppercase">Hasil</button>`;
                list.appendChild(div);
            });
        };

        window.showScan = function(id) {
            const items = JSON.parse(localStorage.getItem('lsppi_v27') || "[]");
            const d = items.find(x => x.id === id);
            if(d) {
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('public-view').classList.remove('hidden');
                document.getElementById('pub-nama').innerText = d.nama;
                document.getElementById('pub-no').innerHTML = formatRow(d.no);
                document.getElementById('pub-skema').innerHTML = formatSkema(d.skema);
                document.getElementById('pub-tgl').innerHTML = formatRow(d.tgl);
                document.getElementById('pub-status').innerHTML = formatRow(d.status);
            }
        };

        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); }
        
        // DETEKSI PENGALIHAN DARI 404.HTML
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const scanId = urlParams.get('id');
            if(scanId) {
                window.showScan(scanId);
                document.getElementById('back-admin-container').classList.add('hidden');
            }
            window.renderDB(); window.updateLive();
        };
    </script>
</body>
</html>

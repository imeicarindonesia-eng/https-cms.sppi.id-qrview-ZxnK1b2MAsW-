<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR View - CMS SPPI</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #reader {
            width: 100%;
            margin: 20px auto;
        }
        #result {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            min-height: 20px;
            word-break: break-all;
            font-size: 14px;
        }
        h2 {
            color: #333;
            margin-bottom: 5px;
        }
        .url {
            color: #666;
            font-size: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>SCAN QR CODE / BARCODE</h2>
    <p class="url">cms.sppi.id/qrview</p>

    <div id="reader"></div>

    <div>
        <h4>Hasil Isi Kode:</h4>
        <div id="result">Menunggu scan...</div>
    </div>
</div>

<script>
    function onScanSuccess(decodedText, decodedResult) {
        document.getElementById("result").innerHTML = decodedText;
        console.log(`Scan hasil: ${decodedText}`);
    }

    var html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
